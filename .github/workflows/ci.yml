name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build and check performance budget
        run: npm run performance:check

  iphone:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Swift app and widgets
        run: scripts/check-ios.sh
      - name: Build iPhone app and widgets without signing
        run: xcodebuild -quiet -project ios/WorldFocus.xcodeproj -scheme WorldFocus -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath "${{ runner.temp }}/WorldFocus-build" CODE_SIGNING_ALLOWED=NO build
