name: WorldFocus
options:
  bundleIdPrefix: com.worldfocus
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  WorldFocus:
    type: application
    platform: iOS
    sources: [WorldFocus, Shared]
    info:
      path: WorldFocus/Info.plist
      properties:
        CFBundleDisplayName: World Focus
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [worldfocus]
    entitlements:
      path: WorldFocus/WorldFocus.entitlements
      properties:
        com.apple.security.application-groups: [group.com.worldfocus.app]
    dependencies:
      - target: FocusWidgets
  FocusWidgets:
    type: app-extension
    platform: iOS
    sources: [FocusWidgets, Shared]
    info:
      path: FocusWidgets/Info.plist
      properties:
        CFBundleDisplayName: World Focus Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FocusWidgets/FocusWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.worldfocus.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worldfocus.WorldFocus.FocusWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  WorldFocus:
    build:
      targets:
        WorldFocus: all
